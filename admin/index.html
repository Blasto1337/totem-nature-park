<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Totem Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: oxblood navigační sloupec s totemem vlevo, pracovní plocha na bone; na mobilu horní lišta s posuvnou navigací */
:root{
  --bg:#F4EEE3; --surface:#FFFBF5; --fill:#ECE2D3; --line:#E0D2BE;
  --ink:#2B1A15; --body:#4A3A34; --muted:#7A6A62;
  --side:#4A241C; --side-deep:#3A1D16; --side-ink:#F4EEE3; --side-muted:#C79A78;
  --gold:#D9A13B; --accent:#8A4A2E; --palm:#2E7D5B; --palm-soft:#DCEBE1;
  --warn:#9A6312; --warn-soft:#F6E5C4; --bad:#A63D2F; --bad-soft:#F4DAD4;
  --on-accent:#FFFBF5;
  --f-display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --f-sans:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-cond:"Barlow Condensed", "Arial Narrow", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F110E; --surface:#2A1713; --fill:#351F1A; --line:#4A2D25;
  --ink:#F4EEE3; --body:#E3D6C6; --muted:#C79A78;
  --side:#160C0A; --side-deep:#120908; --side-ink:#F4EEE3; --side-muted:#C79A78;
  --gold:#D9A13B; --accent:#E0A55A; --palm:#5DB98C; --palm-soft:#1E3A2D;
  --warn:#E6B45C; --warn-soft:#3D2E14; --bad:#E57A68; --bad-soft:#43201A;
  --on-accent:#1F110E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F110E; --surface:#2A1713; --fill:#351F1A; --line:#4A2D25;
  --ink:#F4EEE3; --body:#E3D6C6; --muted:#C79A78;
  --side:#160C0A; --side-deep:#120908; --side-ink:#F4EEE3; --side-muted:#C79A78;
  --gold:#D9A13B; --accent:#E0A55A; --palm:#5DB98C; --palm-soft:#1E3A2D;
  --warn:#E6B45C; --warn-soft:#3D2E14; --bad:#E57A68; --bad-soft:#43201A;
  --on-accent:#1F110E; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--f-sans);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}
.brand img{width:22px;height:auto}
.brand b{font-family:var(--f-cond);font-weight:700;letter-spacing:.22em;font-size:13px;line-height:1.2;display:block}
.brand small{font-family:var(--f-cond);color:var(--side-muted);letter-spacing:.16em;font-size:11px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--side-deep);box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--gold);color:#3A1D16;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav .new{margin-left:auto;font-family:var(--f-cond);letter-spacing:.12em;font-size:10px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 6px}
.who{margin-top:auto;border-top:1px solid rgba(244,238,227,.14);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.who label{font-family:var(--f-cond);letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--side-muted)}
.who select{background:var(--side-deep);color:var(--side-ink);border-color:rgba(244,238,227,.18)}
.who p{margin:0;font-size:12px;color:var(--side-muted)}
.who .langs{background:var(--side-deep);align-self:flex-start;flex-wrap:nowrap}
.who .langs button{color:var(--side-ink);padding:4px 10px;font-size:12px;letter-spacing:.06em}
.who .langs button[aria-pressed="true"]{background:var(--gold);color:#3A1D16}
.weblink{color:var(--side-muted);font-size:13px;font-weight:600;text-decoration:none}
.weblink:hover{color:var(--side-ink)}
/* main */
.main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.demo{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-cond);letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--muted);background:var(--fill);border-radius:99px;padding:3px 10px}
.demo i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:block}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:12px 0 22px}
.eyebrow{font-family:var(--f-cond);font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:30px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--ink);margin:0}
h3{font-size:15px;color:var(--ink);margin:0;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.stat{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat span{font-family:var(--f-cond);letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;color:var(--muted)}
.stat b{display:block;font-size:26px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.stat small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--side);border-color:var(--side);color:#F4EEE3}
.btn.pri:hover{filter:brightness(1.15)}
.btn.ok{background:var(--palm);border-color:var(--palm);color:var(--on-accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--fill);color:var(--body);white-space:nowrap}
.pill.ok{background:var(--palm-soft);color:var(--palm)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .grow{flex:1;min-width:0}
.li .meta{color:var(--muted);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;color:#F4EEE3;background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--palm);border-radius:99px}
.bar.warn i{background:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--f-cond);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.check{all:unset;cursor:pointer;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check[aria-pressed="true"]{background:var(--palm);border-color:var(--palm)}
.check[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check:focus-visible{outline:2px solid var(--gold)}
.done-t{text-decoration:line-through;color:var(--muted)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--fill);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h2 span{color:var(--muted);font-weight:500}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.task.late{box-shadow:inset 3px 0 0 var(--bad)}
.task.prio{box-shadow:inset 3px 0 0 var(--gold)}
/* shifts */
.sh td,.sh th{text-align:center;padding:6px 4px}
.sh td:first-child,.sh th:first-child{text-align:left;padding-left:8px}
.cell{all:unset;cursor:pointer;display:block;width:100%;min-width:44px;border-radius:7px;padding:6px 0;font-weight:700;font-size:13px;text-align:center}
.cell:focus-visible{outline:2px solid var(--gold)}
.c-R{background:var(--palm-soft);color:var(--palm)}
.c-O{background:var(--warn-soft);color:var(--warn)}
.c-V{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.today{background:var(--fill)}
/* pos */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prod{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.prod:hover{border-color:var(--accent)}
.prod:focus-visible{outline:2px solid var(--gold)}
.prod b{color:var(--ink);font-weight:600}
.prod span{color:var(--muted);font-size:13px}
.prod em{font-style:normal;margin-top:auto;font-weight:700;color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--fill);font-weight:600;font-size:13px}
.tab[aria-pressed="true"]{background:var(--side);color:#F4EEE3}
.tab:focus-visible{outline:2px solid var(--gold)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.total b{font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:28px;text-align:center;padding:3px 0;font-weight:700}
.qty button:hover{background:var(--fill)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px}
.note{font-size:13px;color:var(--muted)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-sans)}
.leg{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#F4EEE3;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30}
.modal{position:fixed;inset:0;background:rgba(20,10,8,.5);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal pre{white-space:pre-wrap;font-family:var(--f-sans);margin:0;background:var(--fill);padding:14px;border-radius:8px;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
/* rezervace: kalendář a režim */
.seg{display:inline-flex;background:var(--fill);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--side);color:#F4EEE3}
.seg button:focus-visible{outline:2px solid var(--gold)}
.cal td,.cal th{text-align:center;padding:6px 4px}
.cal td:first-child,.cal th:first-child{text-align:left;padding-left:8px}
.slotc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:70px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--ink);text-align:center}
.slotc:hover{border-color:var(--accent)}
.slotc.off{background:repeating-linear-gradient(45deg,var(--fill),var(--fill) 6px,var(--surface) 6px,var(--surface) 12px);color:var(--muted)}
.slotc:focus-visible{outline:2px solid var(--gold)}
.slotc:disabled{cursor:default}
.slotc .bar{display:block;width:100%}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.04em}
/* web rezervace */
.webwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.browser{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.bbar{display:flex;gap:6px;align-items:center;padding:9px 12px;background:var(--fill);border-bottom:1px solid var(--line)}
.bbar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;flex:none}
.bbar span{margin-left:8px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:99px;padding:3px 12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site{padding:22px;display:flex;flex-direction:column;gap:14px}
.site-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.site .big{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ink);margin:0;line-height:1.1}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--fill);color:var(--muted)}
.steps span.on{background:var(--side);color:#F4EEE3}
.steps span.done{background:var(--palm-soft);color:var(--palm)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pick{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;background:var(--surface);min-width:0}
.pick small{color:var(--muted);font-size:11px}
.pick b{color:var(--ink);font-size:16px}
.pick[aria-pressed="true"]{border-color:var(--side);box-shadow:inset 0 0 0 1px var(--side);background:var(--fill)}
.pick:disabled{opacity:.45;cursor:not-allowed}
.pick:focus-visible{outline:2px solid var(--gold)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slots .pick{flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px;text-align:left}
.hold{display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.fl input,.fl select{width:100%}
.qr{background:#fff;padding:8px;border-radius:10px;width:184px;height:184px;display:grid;place-items:center;border:1px solid var(--line)}
.qr svg,.qr img{width:100%;height:100%;display:block}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail-h{background:var(--fill);padding:10px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mail-h b{color:var(--ink)}
.mail-b{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:var(--surface)}
.mail-b .list{width:100%;text-align:left}
.att{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;background:var(--fill);border-radius:8px;padding:5px 10px}
.flow{margin:0;padding:0;counter-reset:f;display:flex;flex-direction:column}
.flow li{list-style:none;display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.flow li:first-child{border-top:0;padding-top:0}
.flow li::before{counter-increment:f;content:counter(f);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--fill);color:var(--muted)}
.flow li.on{color:var(--ink);font-weight:600}
.flow li.on::before{background:var(--gold);color:#3A1D16}
.flow li.done::before{background:var(--palm);color:var(--on-accent)}
.kv td{padding:6px 8px}
.kv td:first-child{color:var(--muted);width:45%}
/* vstup a sken */
.scan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.cam{aspect-ratio:4/3;background:#160C0A;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;text-align:center;padding:16px;color:#C79A78}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:14px;pointer-events:none}
.res{border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.res.ok{background:var(--palm-soft);color:var(--palm)}
.res.bad{background:var(--bad-soft);color:var(--bad)}
.res.warn{background:var(--warn-soft);color:var(--warn)}
.res .big{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
.res p{margin:0;color:var(--ink)}
/* tým: organizační struktura a kontakty */
.org{display:flex;flex-direction:column;align-items:center}
.org-node{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;min-width:min(280px,100%);box-shadow:inset 3px 0 0 var(--gold)}
.org-node:hover{border-color:var(--accent)}
.org-node:focus-visible{outline:2px solid var(--gold)}
.org-node small,.mem small{display:block;color:var(--muted);font-size:12px}
.org-node b{color:var(--ink);font-weight:600}
.org-v{width:2px;height:18px;background:var(--line)}
.org-teams{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;padding-top:18px}
.org-teams::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:var(--line)}
.org-team{position:relative;background:var(--fill);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.org-team::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:var(--line)}
.org-team.ext{background:transparent;border:1.5px dashed var(--line)}

const batchesOf=id=>{const g={};S.moves.filter(m=>m.item===id&&m.batch).forEach(m=>{g[m.batch]=g[m.batch]||{batch:m.batch,exp:m.exp,qty:0};g[m.batch].qty+=m.qty;if(m.exp)g[m.batch].exp=m.exp});return Object.values(g).filter(b=>b.qty>1e-9).sort((a,b)=>(a.exp||'9').localeCompare(b.exp||'9'))};
const mvKey=m=>{const[d,mo]=m.d.split('.').map(x=>parseInt(x));const[h,mi]=String(m.t).split(':').map(Number);return ((mo*100+d)*24+h)*60+mi};
const byNewest=a=>a.slice().sort((x,y)=>mvKey(y)-mvKey(x));
const isLow=i=>onHand(i.id)<=i.min;
const daysLeft=i=>i.daily?Math.floor(onHand(i.id)/i.daily):null;
const myItems=()=>{const c=ROLECATS[S.role];return S.items.filter(i=>i.active!==false&&(!c||c.includes(i.cat)))};
const expiring=()=>myItems().flatMap(i=>batchesOf(i.id).filter(b=>b.exp&&daysTo(b.exp)<=60).map(b=>({...b,item:i})));
const catOf=d=>S.items.filter(i=>(DEPTCAT[d]||[]).includes(i.cat)&&i.active!==false).map(i=>[i.name,i.unit,i.cost,i.id]);
const CAT=new Proxy({},{get:(_,d)=>catOf(d)});
function addMove(itemId,qty,kind,loc,o={}){
  const it=item(itemId);
  const b=o.batch!==undefined?o.batch:(it&&it.batches&&qty<0?(batchesOf(itemId)[0]||{}).batch:null);
  S.moves.push({id:'m'+(S.moves.length+1)+'_'+Math.random().toString(36).slice(2,6),item:itemId,qty,kind,loc:loc||(it&&it.loc),batch:b||null,exp:o.exp||null,d:o.d||TD,t:o.t||nowT(),by:o.by||S.role,note:o.note||'',ref:o.ref||null});
}

  Object.entries(SEED_END).forEach(([i,locs])=>Object.entries(locs).forEach(([l,end])=>{

function rcvConfirm(){
  const r=S.rcv;if(!r)return;
  const lines=r.lines.filter(l=>+l.qty>0);
  if(!lines.length){toast('Zadej, kolik čeho přišlo');return}
  const miss=lines.find(l=>item(l.item).batches&&(!l.batch||!l.exp));
  if(miss){toast(`${item(miss.item).name}: doplň šarži a expiraci`);return}
  const id='P-'+String(S.receipts.length+1).padStart(4,'0');
  let total=0,short=0;
  lines.forEach(l=>{
    const i=item(l.item),q=+l.qty,p=l.price===''||l.price==null?null:+l.price;
    const have=Math.max(0,onHand(i.id));
    if(p!=null){i.cost=i.cost==null||have<=0?p:Math.round((i.cost*have+p*q)/(have+q)*100)/100;total+=p*q}
    addMove(i.id,q,'receipt',l.loc,{note:r.sup||'Naskladnění',batch:i.batches?l.batch:null,exp:i.batches?l.exp:null,ref:id});
    if(l.ordered!=null&&q<l.ordered)short++;
  });
  r.lines.filter(l=>l.ordered!=null&&!(+l.qty>0)).forEach(()=>short++);
  total=Math.round(total*100)/100;
  S.receipts.unshift({id,d:TD,by:S.role,sup:r.sup||(r.src?'Nákup':'Bez objednávky'),src:r.src,lines,photo:r.photo,total,short});
  if(r.src){const q=S.req.find(x=>x.id==r.src);if(q)q.st='naskladneno'}
  S.rcv=null;render();
  toast(short?`Naskladněno, ale ${short} ${short===1?'položka dorazila':'položky dorazily'} v menším množství. Šimon dostal upozornění.`:`Naskladněno ${lines.length} ${lines.length===1?'položka':lines.length<5?'položky':'položek'}, příjemka ${id}`);
}

function issueSubmit(){
  const s=S.iss,i=item(s.item),q=+$('#isQty').value,note=$('#isNote').value.trim();

const gross=b=>b.ad*PRICE.ad+b.ch*PRICE.ch;

const pax=b=>b.ad+b.ch+b.inf;
const reqSum=r=>r.items.reduce((s,i)=>s+i[1]*i[2],0);

/* rezervace: kapacity, online vstupenky */
const tsum=o=>o.ad*PRICE.ad+o.ch*PRICE.ch;
const fee=o=>Math.round((tsum(o)*0.0349+0.49)*100)/100;
const live=o=>!['zruseno','vyprselo'].includes(o.st);
const paidSt=o=>['zaplaceno','pouzito'].includes(o.st);
const agPax=(d,s)=>d===TD?S.book.filter(b=>!s||b.slot===s).reduce((a,b)=>a+pax(b),0):(s?(AG[d]?.[s]||0):SLOTS.reduce((a,x)=>a+(AG[d]?.[x]||0),0));
const onPax=(d,s)=>S.online.filter(o=>o.date===d&&live(o)&&(!s||o.slot===s)).reduce((a,o)=>a+pax(o),0);
const used=(d,s)=>agPax(d,s)+onPax(d,s);
const capOf=s=>s?CAP:CAP*SLOTS.length;
const isClosed=(d,s)=>s?!!S.closed[d+'|'+s]:SLOTS.every(x=>S.closed[d+'|'+x]);
const leftOf=(d,s)=>isClosed(d,s)?0:capOf(s)-used(d,s);
const onToday=()=>S.online.filter(o=>o.date===TD&&paidSt(o));
const onNetToday=()=>onToday().reduce((a,o)=>a+tsum(o)-fee(o),0);
const slotLbl=o=>o.slot?'okruh '+o.slot:'volný vstup';
const stPill=o=>`<span class="pill ${OST[o.st][1]}">${OST[o.st][0]}</span>`;
const dEn=d=>{const x=DAYS.find(z=>z[1]===d);return `${x?DAYEN[x[0]]:''} ${parseInt(d)} Dec`};
const vst=n=>n+' '+(n===1?'vstupenka':n>=2&&n<=4?'vstupenky':'vstupenek');
const hhmm=()=>{const n=new Date();return n.getHours()+':'+String(n.getMinutes()).padStart(2,'0')};
const newCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='TNP-';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
function qrSvg(t){
  try{if(window.qrcode){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}}catch(e){}
  let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h%100};
  const n=25;let r='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);let on;
    if(f){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);on=fx===0||fx===6||fy===0||fy===6||(fx>1&&fx<5&&fy>1&&fy<5)}else on=rnd()<48;
    if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" fill="#2B1A15" role="img" aria-label="QR kód (náhled)">${r}</svg>`;
}

function check(code){
  code=String(code||'').trim().toUpperCase();
  if(!code)return;
  S.scan.code=code;
  const o=S.online.find(x=>x.code===code);let r;
  if(!o)r={k:'bad',t:'Neznámý kód',p:'Vstupenka v systému neexistuje. Zkontroluj kód nebo hledej hosta podle jména.'};
  else if(o.st==='zruseno')r={k:'bad',t:'Zrušená vstupenka',p:'Objednávka byla stornována a peníze vráceny.',o};
  else if(o.st==='vyprselo')r={k:'bad',t:'Nezaplaceno',p:'Rezervace nebyla zaplacena a místa se uvolnila. Host může koupit vstup na místě.',o};
  else if(o.st==='drzi')r={k:'warn',t:'Čeká na platbu',p:'Host ještě nedokončil platbu. Může zaplatit kartou na baru.',o};
  else if(o.st==='pouzito')r={k:'bad',t:'Už použitá',p:`Tahle vstupenka prošla branou dnes v ${o.used}.`,o};
  else if(o.date!==TD)r={k:'warn',t:`Vstupenka je na ${o.date}`,p:'Datum nesedí. Pokud je dnes volno, můžeš ji přesunout na dnešek.',o,move:true};
  else r={k:'ok',t:'Platná vstupenka',p:'',o,go:true};
  S.scan.res=r;render();
}
async function camToggle(){
  if(S.cam){stopCam();render();return}
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){toast('Tenhle prohlížeč skenovat neumí, použij testovací kódy');return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.cam=st;render(true);
    const v=$('#vid');v.srcObject=st;await v.play();
    const det=new BarcodeDetector({formats:['qr_code']});
    const loop=async()=>{if(!S.cam||!document.getElementById('vid'))return;try{const c=await det.detect(v);if(c.length){stopCam();check(c[0].rawValue.split('/').pop());return}}catch(e){}requestAnimationFrame(loop)};
    loop();
  }catch(e){stopCam();render();toast('Kamera není dostupná')}
}
function stopCam(){if(S.cam){S.cam.getTracks().forEach(t=>t.stop());S.cam=null}}

/* ---------- SMĚNY ---------- */
function vSmeny(){
  const days=['Po 14.','Út 15.','St 16.','Čt 17.','Pá 18.','So 19.','Ne 20.'];
  const edit=S.role==='simon';
  return head('Týden 14.–20. 12. 2026','Směny',edit?'Klikem na políčko přepneš ranní, odpolední a volno.':'Svou dostupnost a výměny posíláš řediteli ke schválení.')+
  `<div class="grid g-main"><section class="card"><div class="tbl-wrap"><table class="sh"><thead><tr><th>Zaměstnanec</th>${days.map((d,i)=>`<th class="${i===5?'today':''}">${d}</th>`).join('')}</tr></thead><tbody>
  ${Object.entries(S.shifts).map(([k,v])=>`<tr><td><div class="row" style="flex-wrap:nowrap">${av(k)}<div><b style="color:var(--ink)">${STAFF[k].n}</b><div class="note">${STAFF[k].r}</div></div></div></td>${[...v].map((c,i)=>`<td class="${i===5?'today':''}"><button class="cell c-${c}" ${edit?`data-shift="${k}:${i}"`:'disabled'} aria-label="${STAFF[k].n} ${days[i]}: ${c==='R'?'ranní':c==='O'?'odpolední':'volno'}">${c==='V'?'volno':c}</button></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <div class="leg"><span><i style="background:var(--palm)"></i>R ranní 7:00 až 15:00</span><span><i style="background:var(--gold)"></i>O odpolední 11:00 až 19:00</span></div></section>
  <div class="grid">
    <section class="card"><h2>Žádost o výměnu</h2>${S.swap.open?`<div class="li">${av(S.swap.from)}<div class="grow"><h3>${STAFF[S.swap.from].n} ↔ ${STAFF[S.swap.to].n}</h3><div class="meta">neděle 20. 12. · rodinná oslava</div></div></div>${edit?`<div class="row"><button class="btn ok" data-act="swapok">Schválit</button><button class="btn" data-act="swapno">Zamítnout</button></div>`:'<span class="pill warn">Čeká na Šimona</span>'}`:'<div class="empty">Žádné otevřené žádosti</div>'}</section>
    <section class="card"><h2>Obsazení stanovišť v sobotu</h2><div class="list">
      ${[['Průvodci, 2 okruhy',['carla','jose']],['Chov a krmení',['yasmin','miguel']],['Veterina',['ramon']],['Bar, shop a vstup',['ana']],['Údržba',[]]].map(([n,p])=>{const on=p.filter(x=>S.shifts[x][5]!=='V');return `<div class="li"><div class="grow"><h3>${n}</h3><div class="meta">${on.map(x=>STAFF[x].n).join(', ')||'nikdo'}</div></div><span class="pill ${on.length?'ok':'bad'}">${on.length?'pokryto':'chybí'}</span></div>`}).join('')}
    </div></section>
  </div></div>`;
}

/* ---------- ÚKOLY ---------- */
function vUkoly(){
  const cols=['Udělat','Probíhá','Hotovo'];
  const mineOnly=S.role!=='simon';
  const list=S.tasks.filter(t=>!mineOnly||t.w===S.role);
  return head(TODAY,'Úkoly',mineOnly?'Tvoje úkoly. Opakované se samy vytváří každý den nebo týden.':'Opakované úkoly se zakládají samy, u některých je potřeba potvrdit fotkou.')+
  (S.role==='simon'?`<section class="card" style="margin-bottom:16px"><form class="form" id="taskForm"><label style="grid-column:span 2">Nový úkol<input id="tT" placeholder="Např. Zkontrolovat zámky voliér" required></label><label>Komu<select id="tW">${Object.keys(STAFF).map(k=>`<option value="${k}">${STAFF[k].n}</option>`).join('')}</select></label><label><span>&nbsp;</span><button class="btn pri" type="submit">Přidat</button></label></form></section>`:'')+
  `<div class="kan">${cols.map((c,ci)=>{const ts=list.filter(t=>t.col===ci);return `<div class="col"><h2>${c} <span>${ts.length}</span></h2>${ts.map(t=>`<div class="task ${t.late&&ci<2?'late':t.prio&&ci<2?'prio':''}"><h3 class="${ci===2?'done-t':''}">${t.t}</h3><div class="row">${av(t.w)}<span class="note">${STAFF[t.w].n} · ${t.due}</span></div><div class="row">${t.rep?`<span class="pill">${t.rep}</span>`:''}${t.photo?'<span class="pill">📷 foto</span>':''}${t.late&&ci<2?'<span class="pill bad">Po termínu</span>':''}${t.prio&&ci<2?'<span class="pill gold">Priorita</span>':''}${ci<2?`<button class="btn sm" style="margin-left:auto" data-move="${t.id}">${ci===0?'Začít':'Hotovo'}</button>`:''}</div></div>`).join('')||'<div class="empty">Prázdné</div>'}</div>`}).join('')}</div>`;
}

/* ---------- ZVÍŘATA ---------- */

  return head(TODAY,'Zvířata a krmení','Krmné dávky podle plánu. Ošetřovatel odklikne, zásoby se odečtou ze skladu.')+
  `<div class="grid g-main"><section class="card"><div class="card-h"><h2>Plán krmení</h2><span class="pill">${S.feed.filter(f=>f.ok).length} z ${S.feed.length}</span></div><div class="list">
  ${S.feed.map((f,i)=>`<div class="li"><button class="check" aria-pressed="${f.ok}" aria-label="Nakrmeno: ${f.g} ${f.t}" data-feed="${i}"></button><b class="num" style="width:44px;color:var(--ink)">${f.t}</b><div class="grow"><h3 class="${f.ok?'done-t':''}">${f.g} <span class="note">· ${f.n} ks</span></h3><div class="meta">${f.f}</div></div>${av(f.w)}</div>`).join('')}
  </div></section>
  <div class="grid">
    <section class="card"><div class="card-h"><h2>Sklad krmiva</h2><button class="btn sm" data-go="sklad">Celý sklad</button></div><div class="list">${S.items.filter(i=>i.cat==='feed').map(i=>{const dl=daysLeft(i);return `<div class="li"><div class="grow"><h3>${i.name}</h3><div class="bar ${dl<=2?'warn':''}" style="margin-top:6px"><i style="width:${Math.min(100,dl/14*100)}%"></i></div></div><span class="pill ${dl<=1?'bad':dl<=2?'warn':''} num">${dl} ${dl===1?'den':dl>1&&dl<5?'dny':'dní'}</span>${dl<=2?`<button class="btn sm" data-tobasket="${i.id}">Do košíku</button>`:''}</div>`}).join('')}</div><p class="note" style="margin:0">Na kolik dní krmivo vystačí podle denní spotřeby. V ostré verzi odklik krmení rovnou odečte dávku ze skladu.</p></section>
    <section class="card"><h2>Zdravotní deník</h2><div class="list">${S.health.map(h=>`<div class="li"><div class="grow"><h3>${h.a}</h3><div class="meta">${h.t}</div><div class="meta">${h.d} · ${STAFF[h.w].n}</div></div><span class="pill ${h.st==='ok'?'ok':'warn'}">${h.st==='ok'?'v pořádku':'sledovat'}</span></div>`).join('')}</div><p class="note">Historii jde vyexportovat pro úřady jedním klikem.</p></section>
  </div></div>`;
}

/* ---------- NÁKUPY ---------- */
function vNakupy(){
  const boss=S.role==='simon';
  const dept=boss?S.dept:DEPT[S.role];
  const bsum=S.basket.reduce((s,i)=>s+i[1]*i[2],0);
  const queue=boss?S.req:S.req.filter(r=>r.by===S.role);
  const order=['ceka','schvaleno','koupeno','vraceno','naskladneno','zamitnuto'];
  const sorted=[...queue].sort((a,b)=>order.indexOf(a.st)-order.indexOf(b.st));
  return head(TODAY,'Nákupy',boss?'Košíky od údržby, veterináře a chovu chodí sem ke schválení. Po nákupu se zapíšou do výdajů.':'Naklikej, co potřebuješ, a pošli Šimonovi ke schválení.')+
  `<div class="pos">
    <section class="card"><div class="card-h"><h2>Katalog · ${DEPTN[dept]}</h2>${boss?`<div class="tabs">${Object.keys(DEPTN).map(d=>`<button class="tab" aria-pressed="${d===dept}" data-dept="${d}">${DEPTN[d]}</button>`).join('')}</div>`:''}</div>
      <div class="prods">${CAT[dept].map((p,i)=>`<button class="prod" data-add="${dept}:${i}"><b>${p[0]}</b><span>za ${p[1]}</span><em>${p[2]!=null?usd(p[2]):'cena?'}</em></button>`).join('')}</div>
      <p class="note">Ceny jsou orientační, skutečnou částku doplní ten, kdo nakupuje.</p>
    </section>
    <section class="card"><h2>Můj košík</h2>
      ${S.basket.length?`<div class="list">${S.basket.map((b,i)=>`<div class="li"><div class="grow"><h3>${b[0]}</h3><div class="meta">${usd(b[2])} / ks</div></div><span class="qty"><button data-q="${i}:-1" aria-label="Ubrat">−</button><span>${b[1]}</span><button data-q="${i}:1" aria-label="Přidat">+</button></span></div>`).join('')}</div>
      <label class="note" for="bNote">K čemu to je</label><textarea id="bNote" rows="2" placeholder="Např. oprava plotu u opic">${S.basketNote}</textarea>
      <div class="tabs">${['Běžné','Spěchá'].map(u=>`<button class="tab" aria-pressed="${S.basketUrg===u}" data-urg="${u}">${u}</button>`).join('')}</div>
      <div class="total"><span>Celkem odhad</span><b>${usd(bsum)}</b></div>
      <button class="btn pri" data-act="sendBasket">${boss?'Uložit jako nákup':'Odeslat ke schválení'}</button>`:'<div class="empty">Košík je prázdný. Klikni na položku v katalogu.</div>'}
    </section>
  </div>
  <section class="card" style="margin-top:16px"><h2>${boss?'Žádosti o nákup':'Moje žádosti'}</h2><div class="list">
  ${sorted.length?sorted.map(r=>`<div class="li" style="align-items:flex-start">${av(r.by)}<div class="grow"><div class="row"><h3>${r.note}</h3>${r.urg==='Spěchá'?'<span class="pill bad">Spěchá</span>':''}</div><div class="meta">${STAFF[r.by].n} · ${DEPTN[r.dept]} · ${r.d}</div><div class="meta">${r.items.map(i=>`${i[1]}× ${i[0]}`).join(', ')}</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><b class="num" style="color:var(--ink)">${usd(reqSum(r))}</b><span class="pill ${ST[r.st][1]}">${ST[r.st][0]}</span>
    ${boss&&r.st==='ceka'?`<div class="row"><button class="btn ok sm" data-rq="${r.id}:schvaleno">Schválit</button><button class="btn sm" data-rq="${r.id}:vraceno">Vrátit</button><button class="btn sm" data-rq="${r.id}:zamitnuto">Zamítnout</button></div>`:''}
    ${['schvaleno','koupeno'].includes(r.st)?`<div class="row">${r.st==='schvaleno'?`<button class="btn sm" data-rq="${r.id}:koupeno">Koupeno</button>`:''}<button class="btn sm pri" data-rcvsrc="${r.id}">Naskladnit</button></div>`:''}
  </div></div>`).join(''):'<div class="empty">Zatím žádné žádosti</div>'}
  </div></section>`;
}

/* ---------- POKLADNA ---------- */
function vPokladna(){
  const sum=S.cart.reduce((s,c)=>s+c[1]*c[2],0);
  const rate=60;
  const open=S.sales.filter(s=>!s.closed);
  const by=m=>open.filter(s=>s.pay===m).reduce((a,s)=>a+s.sum,0);
  const last=S.closings[0];
  return head(TODAY,'Pokladna','Bar a souvenir shop. Hotovost v USD i pesos, karta přes terminál.')+
  `<div class="pos">
    <section class="card"><div class="tabs">${Object.keys(S.prods).map(c=>`<button class="tab" aria-pressed="${S.posCat===c}" data-pc="${c}">${c==='Bar'?'Bar':'Souvenir shop'}</button>`).join('')}</div>
      <div class="prods">${S.prods[S.posCat].map((p,i)=>`<button class="prod" data-sell="${i}"><b>${p[0]}</b><span>${p[1]}</span><em>${usd(p[2])}</em></button>`).join('')}</div></section>
    <section class="card"><h2>Účtenka</h2>
      ${S.cart.length?`<div class="list">${S.cart.map((c,i)=>`<div class="li"><div class="grow"><h3>${c[0]}</h3><div class="meta">${usd(c[2])}</div></div><span class="qty"><button data-cq="${i}:-1" aria-label="Ubrat">−</button><span>${c[1]}</span><button data-cq="${i}:1" aria-label="Přidat">+</button></span></div>`).join('')}</div>
      <div class="total"><span>K zaplacení</span><b>${usd(sum)}</b></div>
      ${S.payWith==='DOP'?`<p class="note num">= ${(sum*rate).toLocaleString(LOC())} DOP (kurz nastavíš v adminu, tady ukázka 1 USD = ${rate} DOP)</p>`:''}
      <div class="tabs">${[['USD','Hotově USD'],['DOP','Hotově DOP'],['Karta','Karta']].map(([k,l])=>`<button class="tab" aria-pressed="${S.payWith===k}" data-pay="${k}">${l}</button>`).join('')}</div>
      <button class="btn pri" data-act="paid">Zaplaceno</button>`:'<div class="empty">Klikni na produkt a přidá se na účtenku</div>'}
    </section>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <section class="card"><h2>Dnešní prodeje</h2><div class="list">${S.sales.map(s=>`<div class="li"><b class="num" style="width:44px;color:var(--ink)">${s.t}</b><div class="grow"><h3>${s.items}</h3></div><span class="pill">${s.pay}</span><b class="num">${usd(s.sum)}</b></div>`).join('')}</div></section>
    <section class="card"><div class="card-h"><h2>Uzávěrka dne</h2>${open.length?`<span class="pill">${open.length} otevřených účtenek</span>`:'<span class="pill ok">Uzavřeno</span>'}</div>
    ${open.length?`<div class="tbl-wrap"><table><thead><tr><th></th><th class="r">Má být</th><th class="r">Napočítáno</th></tr></thead><tbody>
      <tr><td>Hotovost USD</td><td class="r">${usd(by('USD'))}</td><td class="r"><input id="cntUsd" type="number" min="0" step="0.01" placeholder="${by('USD')}" style="width:100px" aria-label="Napočítáno USD"></td></tr>
      <tr><td>Hotovost DOP</td><td class="r num">${(by('DOP')*rate).toLocaleString(LOC())} DOP</td><td class="r"><input id="cntDop" type="number" min="0" step="1" placeholder="${by('DOP')*rate}" style="width:100px" aria-label="Napočítáno DOP"></td></tr>
      <tr><td>Karta</td><td class="r">${usd(by('Karta'))}</td><td class="r note">z terminálu</td></tr>
      <tr><td><b>Celkem</b></td><td class="r"><b>${usd(open.reduce((a,x)=>a+x.sum,0))}</b></td><td></td></tr></tbody></table></div>
      <button class="btn pri" data-act="close">Uzavřít den a poslat do financí</button>
      <p class="note" style="margin:0">Ana napočítá hotovost v šuplíku. Tržby se zapíšou do financí rozdělené na bar a shop a podle způsobu platby, rozdíl v pokladně zvlášť. Rozdíl od 5 USD dostane Šimon jako upozornění.</p>`:
      `<p class="note" style="margin:0">Dnešní uzávěrka je hotová${last&&last.d===TD?` (${last.t}, ${STAFF[last.by].n})`:''}. Tržby jsou ve financích.</p>`}
    </section>
  </div>`;
}

/* ---------- FINANCE ---------- */
function vFinance(){
  const todayNet=S.book.reduce((s,b)=>s+net(b),0)+salesSum()+onNetToday();
  const bought=S.req.filter(r=>['koupeno','naskladneno'].includes(r.st));
  const todayExp=bought.filter(r=>r.d==='19. 12.').reduce((s,r)=>s+reqSum(r),0)+140;
  const days=['Ne 13.','Po 14.','Út 15.','St 16.','Čt 17.','Pá 18.','So 19.'];
  const inc=[1180,1420,980,1650,1310,2040,Math.round(todayNet)];
  const exp=[420,380,1250,300,510,260,Math.round(todayExp)];
  const max=Math.max(...inc,...exp)*1.1, H=170, W=560, bw=22, gap=W/7;
  const y=v=>H-v/max*H;
  const ticks=[0,1000,2000].filter(t=>t<max);
  const chart=`<svg class="chart" viewBox="-40 -10 ${W+50} ${H+34}" style="width:100%;height:auto" role="img" aria-label="Příjmy a výdaje za posledních 7 dní">
    ${ticks.map(t=>`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="-8" y="${y(t)+4}" text-anchor="end">${t.toLocaleString(LOC())}</text>`).join('')}
    ${inc.map((v,i)=>`<rect x="${i*gap+gap/2-bw-2}" y="${y(v)}" width="${bw}" height="${H-y(v)}" rx="3" fill="var(--palm)"/><rect x="${i*gap+gap/2+2}" y="${y(exp[i])}" width="${bw}" height="${H-y(exp[i])}" rx="3" fill="var(--gold)"/><text x="${i*gap+gap/2}" y="${H+18}" text-anchor="middle" ${i===6?'style="fill:var(--ink);font-weight:700"':''}>${days[i]}</text>`).join('')}
  </svg>`;
  const recv=[['Miro Travel','týdně','14.–20. 12.',1240,'otevřené'],['Nexus Tours','měsíčně','prosinec',2980,'otevřené'],['Amstar','měsíčně','prosinec',1515,'otevřené'],['Hotel v Uvero Alto','týdně','7.–13. 12.',410,'po splatnosti']];
  const exps=[...S.receipts.filter(r=>!r.src&&!r.init&&r.d===TD&&r.total).map(r=>[r.d,'Naskladnění: '+r.sup,'Sklad',r.total]),...bought.map(r=>[r.d,r.note,DEPTN[r.dept],reqSum(r)]),['18. 12.','Elektřina, listopad','Energie',612],['17. 12.','Palivo pro pick-up','Doprava',85],['15. 12.','Zálohy na mzdy','Mzdy',3200]];
  return head('Prosinec 2026','Finance','Příjmy ze vstupů se počítají samy z odbavených rezervací a online vstupenek, výdaje ze schválených nákupů.')+
  `<div class="stats">
    <div class="stat"><span>Příjmy prosinec</span><b>${usd(17280+Math.round(todayNet))}</b><small>plán 28 000 USD</small></div>
    <div class="stat"><span>Výdaje prosinec</span><b>${usd(11940+Math.round(todayExp))}</b><small>plán 21 500 USD</small></div>
    <div class="stat"><span>Pohledávky</span><b>${usd(recv.reduce((s,r)=>s+r[3],0))}</b><small>1 po splatnosti</small></div>
    <div class="stat"><span>Hotovost v pokladně</span><b>${usd(S.sales.filter(s=>s.pay!=='Karta').reduce((a,s)=>a+s.sum,0)+150)}</b><small>vč. 150 USD drobných</small></div>
  </div>
  <div class="grid g-main">
    <section class="card"><div class="card-h"><h2>Posledních 7 dní, USD</h2><div class="leg"><span><i style="background:var(--palm)"></i>Příjmy</span><span><i style="background:var(--gold)"></i>Výdaje</span></div></div><div class="tbl-wrap">${chart}</div>
      <div><div class="row" style="justify-content:space-between"><span class="note">Cashflow plán prosinec, příjmy</span><span class="note num">${Math.round((17280+todayNet)/28000*100)} %</span></div><div class="bar"><i style="width:${Math.min(100,(17280+todayNet)/28000*100)}%"></i></div></div>
    </section>
    <section class="card"><h2>Pohledávky u partnerů</h2><div class="list">${recv.map(r=>`<div class="li"><div class="grow"><h3>${r[0]}</h3><div class="meta">${r[2]} · fakturace ${r[1]}</div></div><div style="text-align:right"><b class="num" style="color:var(--ink)">${usd(r[3])}</b><br><span class="pill ${r[4]==='po splatnosti'?'bad':''}">${r[4]}</span></div></div>`).join('')}</div><button class="btn" data-act="invoice">Vystavit vyúčtování za týden</button></section>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>Bar a shop · uzávěrky</h2><button class="btn sm" data-go="pokladna">Pokladna</button></div>${S.closings.length?`<div class="tbl-wrap"><table><thead><tr><th>Den</th><th>Kdo</th><th class="r">Účtenek</th><th class="r">Bar</th><th class="r">Shop</th><th class="r">Z toho karta</th><th class="r">Rozdíl v pokladně</th></tr></thead><tbody>${S.closings.map(c=>{const du=c.cntUsd-c.expUsd,dd=c.cntDop-c.expDop;return `<tr><td>${c.d} ${c.t}</td><td>${STAFF[c.by].n}</td><td class="r">${c.n}</td><td class="r">${usd(c.bar)}</td><td class="r">${usd(c.shop)}</td><td class="r">${usd(c.card)}</td><td class="r">${du||dd?`<span class="pill ${Math.abs(du)>=5||Math.abs(dd)>=300?'bad':'warn'}">${du?usd(du):''}${du&&dd?' · ':''}${dd?dd.toLocaleString(LOC())+' DOP':''}</span>`:'<span class="pill ok">sedí</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Zatím žádná uzávěrka</div>'}<p class="note" style="margin:0">Každá uzávěrka zapíše tržby do příjmů, rozdělené na bar a shop a podle způsobu platby.</p></section>
  <section class="card" style="margin-top:16px"><h2>Výdaje</h2><div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Položka</th><th>Kategorie</th><th class="r">Částka</th></tr></thead><tbody>${exps.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td><td><span class="pill">${e[2]}</span></td><td class="r">${usd(e[3])}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ---------- PARTNEŘI ---------- */
function vPartneri(){
  const c={'Aktivní':'ok','Ceník odeslán':'warn','Pozastaveno':'bad'};
  return head('Obchod','Partneři','Agentury, hotely a dopravci. Navazuje na prospect list z Punta Cany.')+

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.alang){if(I18N)I18N.setLang(d.alang);render(!!S.cam);return}
  if(d.go){S.view=d.go;render();window.scrollTo(0,0);return}
  if(d.rtab){S.rtab=d.rtab;render();return}
  if(d.mode){S.mode=d.mode;if(S.w.step<4&&S.w.step!==3){S.w.step=1}if(S.mode==='slot'&&!S.w.slot)S.w.slot=SLOTS.find(s=>leftOf(S.w.date,s)>0)||'13:00';render();toast(S.mode==='free'?'Fáze 2: zákazník kupuje jen den, přijde kdykoliv':'Fáze 1: pevné okruhy s průvodcem');return}
  if(d.close!==undefined){const[day,sl]=d.close.split('|');if(sl){S.closed[day+'|'+sl]=!S.closed[day+'|'+sl]}else{const c=isClosed(day,null);SLOTS.forEach(x=>S.closed[day+'|'+x]=!c)}render();toast(isClosed(day,sl||null)?`${day} ${sl||''} zavřeno, web ho už nenabízí`:`${day} ${sl||''} znovu v prodeji`);return}
  if(d.wd){S.w.date=d.wd;if(S.mode==='slot'&&leftOf(d.wd,S.w.slot)<=0)S.w.slot=SLOTS.find(s=>leftOf(d.wd,s)>0)||null;render();return}
  if(d.ws){S.w.slot=d.ws;render();return}
  if(d.wq){const[k,n]=d.wq.split(':');S.w[k]=Math.max(0,Math.min(20,S.w[k]+Number(n)));render();return}
  if(d.scan){check(d.scan);return}
  if(d.resend){toast('E-mail a WhatsApp s QR odeslány znovu');return}
  if(d.refund){const o=S.online.find(x=>x.code===d.refund);o.st='zruseno';render();toast(`Refund ${usd(tsum(o))} odeslán přes PayPal, místa uvolněna`);return}
  if(d.shift){const[k,i]=d.shift.split(':');const a=[...S.shifts[k]];a[i]={R:'O',O:'V',V:'R'}[a[i]];S.shifts[k]=a.join('');render();return}
  if(d.move){const x=S.tasks.find(x=>x.id==d.move);x.col++;render();toast(x.col===2?'Úkol hotový':'Úkol rozpracovaný');return}
  if(d.done){const x=S.tasks.find(x=>x.id==d.done);x.col=2;render();toast('Hotovo, díky!');return}
  if(d.feed!==undefined){const f=S.feed[d.feed];f.ok=!f.ok;render();return}
  if(d.dept){S.dept=d.dept;render();return}
  if(d.add){const[dp,i]=d.add.split(':');addBasket(CAT[dp][i],dp);render();return}
  if(d.q){const[i,n]=d.q.split(':').map(Number);S.basket[i][1]+=n;if(S.basket[i][1]<=0)S.basket.splice(i,1);render();return}
  if(d.urg){keepNote();S.basketUrg=d.urg;render();return}
  if(d.rq){const[id,st]=d.rq.split(':');S.req.find(r=>r.id==id).st=st;render();toast(ST[st][0]);return}
  if(d.pc){S.posCat=d.pc;render();return}
  if(d.sell!==undefined){const p=S.prods[S.posCat][d.sell];const c=S.cart.find(c=>c[0]===p[0]);c?c[1]++:S.cart.push([p[0],1,p[2]]);render();return}
  if(d.cq){const[i,n]=d.cq.split(':').map(Number);S.cart[i][1]+=n;if(S.cart[i][1]<=0)S.cart.splice(i,1);render();return}
  if(d.pay){S.payWith=d.pay;render();return}
  if(d.stab){S.stab=d.stab;if(d.stab==='prijem'&&S.view!=='sklad')S.view='sklad';render();return}
  if(d.card){skCard(d.card);return}
  if(d.tobasket){toBasket(d.tobasket);return}
  if(d.rcvsrc){startRcv(d.rcvsrc);return}
  if(d.scat){S.scat=d.scat;render();return}
  if(d.mkind){S.mkind=d.mkind;render();return}
  if(d.isstype){S.iss.type=d.isstype;render();return}
  if(d.rcvdel!==undefined){S.rcv.lines.splice(+d.rcvdel,1);render();return}
  if(d.catedit){S.catEdit=d.catedit;render();window.scrollTo(0,0);return}
  if(d.wo){const[it,b]=d.wo.split('|');S.stab='vydej';S.iss={type:'writeoff',item:it,from:null,to:null,batch:b};render();return}
  if(d.person){personCard(d.person);return}
  if(d.pedit){personForm(d.pedit);return}
  if(d.pdel){const p=tp(d.pdel);if(p&&confirm(tr(`Odebrat ${p.n} z týmu?`))){S.team=S.team.filter(x=>x.id!==d.pdel);saveTeam();$('#layer').innerHTML='';render();toast('Odebráno')}return}
  if(d.tphase){S.tphase=+d.tphase;render();return}
  if(d.tflt){S.tflt=d.tflt;render();return}
  if(d.arrive){S.book.find(b=>b.id==d.arrive).st='dorazili';render();toast('Skupina odbavena');return}
  switch(d.act){
    case 'w1':keepW();S.w.step=1;render();break;
    case 'w2':S.w.step=2;render();break;
    case 'w3':{keepW();const w=S.w;if(!w.name.trim()||!/^\S+@\S+\.\S+$/.test(w.email.trim())){toast('Vyplň jméno a platný e-mail');break}const s=S.mode==='free'?null:w.slot;if(pax(w)>leftOf(w.date,s)){S.w.step=1;render();toast('Mezitím se termín zaplnil, vyber jiný');break}const code=newCode();S.online.unshift({code,name:w.name.trim(),email:w.email.trim(),phone:w.phone.trim(),lang:w.lang,date:w.date,slot:s,ad:w.ad,ch:w.ch,inf:w.inf,st:'drzi',hold:Date.now()+15*60000,at:TD});w.code=code;w.step=3;render();break}
    case 'wBack':S.online=S.online.filter(x=>x.code!==S.w.code);S.w.code=null;S.w.step=2;render();toast('Místa uvolněna');break;
    case 'pp':S.w.pm=t.dataset.m;ppModal();break;
    case 'ppPay':{const o=S.online.find(x=>x.code===S.w.code);$('#layer').innerHTML='';if(!o||o.st!=='drzi'){toast('Rezervace mezitím vypršela');render();break}o.st='zaplaceno';delete o.hold;S.w.step=4;render();toast('Platba přijata, e-mail s QR odeslán');break}
    case 'ppFail':$('#layer').innerHTML='';toast('Karta zamítnuta, místa jsou pořád podržená');break;
    case 'expire':{const o=S.online.find(x=>x.code===S.w.code);if(o)o.hold=Date.now()-1;break}
    case 'toScan':S.view='vstup';window.scrollTo(0,0);check(S.w.code);break;
    case 'wNew':S.w.step=1;S.w.code=null;render();break;
    case 'admit':{const o=S.scan.res&&S.scan.res.o;if(!o)break;o.st='pouzito';o.used=hhmm();S.scan.res={k:'ok',t:'Vítejte!',p:`Vstup zapsán v ${o.used}. Počet hostů se propsal do Dneška a reportu.`,o};render();toast(`${pax(o)} hostů puštěno dovnitř`);break}
    case 'moveToday':{const o=S.scan.res&&S.scan.res.o;if(!o)break;if(leftOf(TD,o.slot)<pax(o)){toast(`${o.slot?'Okruh '+o.slot:'Dnešek'} je plný, přesun nejde`);break}o.date=TD;o.st='pouzito';o.used=hhmm();S.scan.res={k:'ok',t:'Přesunuto a puštěno',p:`Vstupenka přesunuta na dnešek, vstup zapsán v ${o.used}.`,o};render();toast('Přesunuto na dnešek');break}
    case 'cam':camToggle();break;
    case 'rcvAdd':{const used=S.rcv.lines.map(l=>l.item);const nx=myItems().find(i=>!used.includes(i.id))||myItems()[0];S.rcv.lines.push(rcvLine(nx.id));render();break}
    case 'rcvPhoto':S.rcv.photo=!S.rcv.photo;render();break;
    case 'rcvCancel':S.rcv=null;render();break;
    case 'rcvConfirm':rcvConfirm();break;
    case 'cardRcv':startRcv('none',t.dataset.id);break;
    case 'cardIssue':$('#layer').innerHTML='';S.view='sklad';S.stab='vydej';S.iss={type:'issue',item:t.dataset.id,from:null,to:null,batch:null};render();break;
    case 'invSave':invSave();break;
    case 'catNew':S.catEdit=null;render();break;
    case 'resetDemo':if(DS){DS.reset();location.hash='';location.reload()}break;
    case 'sendBasket':{keepNote();const r={id:Date.now(),by:S.role,dept:S.role==='simon'?S.dept:DEPT[S.role],items:S.basket.map(b=>[...b]),note:S.basketNote||'Bez popisu',urg:S.basketUrg,st:S.role==='simon'?'schvaleno':'ceka',d:'19. 12.'};S.req.unshift(r);S.basket=[];S.basketNote='';S.basketUrg='Běžné';render();toast(S.role==='simon'?'Nákup uložen':'Odesláno Šimonovi ke schválení');break}
    case 'paid':{const sum=S.cart.reduce((s,c)=>s+c[1]*c[2],0);S.cart.forEach(c=>{const it=S.items.find(i=>i.name===c[0]);if(it)addMove(it.id,-c[1],'sale','bar',{note:'Prodej na baru'})});const shopN=S.prods.Shop.map(x=>x[0]);const shop=S.cart.filter(c=>shopN.includes(c[0])).reduce((a,c)=>a+c[1]*c[2],0);S.sales.unshift({t:nowT(),items:S.cart.map(c=>`${c[1]}× ${c[0]}`).join(', '),sum,bar:sum-shop,shop,pay:S.payWith});S.cart=[];render();toast('Zaplaceno '+usd(sum));break}
    case 'swapok':S.shifts.jose=S.shifts.jose.slice(0,6)+'R';S.shifts.carla=S.shifts.carla.slice(0,6)+'V';S.swap.open=false;render();toast('Výměna schválena');break;
    case 'swapno':S.swap.open=false;render();toast('Žádost zamítnuta');break;
    case 'clockin':t.disabled=true;t.textContent='Příchod 7:02';toast('Příchod zapsán');break;
    case 'close':{const open=S.sales.filter(x=>!x.closed);if(!open.length)break;const rate=60;
      const sm=m=>open.filter(x=>x.pay===m).reduce((a,x)=>a+x.sum,0);
      const iu=$('#cntUsd').value,idp=$('#cntDop').value;
      if(iu===''||idp===''){toast('Napočítej hotovost v USD i DOP');break}
      const c={d:TD,t:nowT(),by:S.role,n:open.length,expUsd:sm('USD'),cntUsd:+iu,expDop:sm('DOP')*rate,cntDop:+idp,card:sm('Karta'),bar:open.reduce((a,x)=>a+(x.bar??x.sum),0),shop:open.reduce((a,x)=>a+(x.shop||0),0)};
      S.closings.unshift(c);open.forEach(x=>x.closed=true);render();
      const du=c.cntUsd-c.expUsd,dd=c.cntDop-c.expDop;
      toast(du||dd?`Uzavřeno s rozdílem ${du?usd(du):''}${du&&dd?' a ':''}${dd?dd.toLocaleString(LOC())+' DOP':''}, zapsáno do financí`:'Uzavřeno, pokladna sedí. Tržby jsou ve financích.');break}
    case 'invoice':toast('Vyúčtování pro Miro Travel připravené k odeslání');break;
    case 'report':modal();break;
    case 'closeModal':$('#layer').innerHTML='';break;
    case 'personNew':personForm(null);break;
    case 'copy':{const txt=reportText();const done=()=>toast('Zkopírováno');try{navigator.clipboard.writeText(txt).then(done,()=>sel())}catch(_){sel()}break}
  }
});
function sel(){const p=document.querySelector('.modal pre');const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text označen, zkopíruj ho')}
function modal(){$('#layer').innerHTML=`<div class="modal" data-bg="1"><section class="card" role="dialog" aria-modal="true" aria-label="Týdenní report"><div class="card-h"><h2>Týdenní report pro Zoo Kontakt</h2><button class="btn sm" data-act="closeModal">Zavřít</button></div><pre>${reportText()}</pre><p class="note">V ostré verzi odchází samo každé pondělí v 8:00 na e-mail vedení.</p><div class="row"><button class="btn pri" data-act="copy">Zkopírovat text</button></div></section></div>`}
document.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.bg)$('#layer').innerHTML=''});
function addBasket(p,dp){keepNote();const b=S.basket.find(b=>b[0]===p[0]);b?b[1]++:S.basket.push([p[0],1,p[2],dp])}
function keepNote(){const n=document.getElementById('bNote');if(n)S.basketNote=n.value}
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scanForm'){check($('#scanIn').value);return}
  if(e.target.id==='bookForm'){const slot=$('#bS').value;const b={id:Date.now(),a:$('#bA').value,slot,ad:+$('#bAd').value||0,ch:+$('#bCh').value||0,inf:+$('#bIn').value||0,tr:$('#bTr').value==='1',st:'potvrzeno'};b.direct=b.a==='Přímý prodej';const u=used(TD,slot);if(isClosed(TD,slot)){toast(`Okruh ${slot} je zavřený`);return}if(u+pax(b)>CAP){toast(`Okruh ${slot} má volných jen ${CAP-u} míst`);return}if(!pax(b)){toast('Zadej počet hostů');return}S.book.push(b);render();toast('Rezervace přidána')}
  if(e.target.id==='issueForm'){issueSubmit();return}
  if(e.target.id==='catForm'){catSubmit();return}
  if(e.target.id==='personForm'){personSubmit(e.target);return}
  if(e.target.id==='taskForm'){S.tasks.unshift({id:Date.now(),t:$('#tT').value,w:$('#tW').value,due:'dnes',col:0});render();toast('Úkol přidán')}
});
$('#role').addEventListener('change',e=>{S.role=e.target.value;S.basket=[];S.basketNote='';render()});

/* odpočet podržených míst a automatické uvolnění */
setInterval(()=>{
  const now=Date.now();let ch=false;
  S.online.forEach(o=>{if(o.st==='drzi'&&o.hold<now){o.st='vyprselo';ch=true}});
  const el=document.getElementById('holdT');
  if(el&&S.w.code){const o=S.online.find(x=>x.code===S.w.code);if(o&&o.st==='drzi')el.textContent=holdLeft(o)}
  if(ch){if(S.w.step===3){S.w.step=1;S.w.code=null;toast('Čas na platbu vypršel, místa se uvolnila')}$('#layer').innerHTML='';render(S.view==='vstup')}
},1000);

/* sklad: formuláře, které se mění bez překreslení */
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='skLoc'){S.sloc=t.value;render();return}
  if(t.id==='invLoc'){S.invLoc=t.value;render();return}
  if(d.iss){S.iss[d.iss]=t.value;if(d.iss==='item'){S.iss.from=null;S.iss.to=null;S.iss.batch=null}render();return}
  if(d.rf){const[n,f]=d.rf.split(':');const l=S.rcv.lines[+n];if(f==='item'){Object.assign(l,rcvLine(t.value))}else l[f]=t.value;if(f==='item')render()}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='teamQ'){S.tq=t.value;filterTeam();return}
  if(d.rcvsup!==undefined&&S.rcv){S.rcv.sup=t.value;return}
  if(d.rf&&S.rcv){const[n,f]=d.rf.split(':');if(f==='item')return;const l=S.rcv.lines[+n];l[f]=t.value;
    if(f==='qty')t.style.borderColor=l.ordered!=null&&+t.value<l.ordered?'var(--gold)':'';
    const el=document.getElementById('rcvTotal');if(el)el.textContent=usd(Math.round(S.rcv.lines.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0)*100)/100);return}
  if(d.inv){const c=+t.value,s=+d.sys,el=document.getElementById('invd_'+d.inv);if(el){const df=Math.round((c-s)*1000)/1000;el.textContent=(df>0?'+':'')+fq(df);el.style.color=df?'var(--bad)':''}}
});

/* změny z webu rezervací v jiné záložce */
window.addEventListener('storage',e=>{if(DS&&(e.key===DS.K_ORDERS||e.key===DS.K_SETTINGS)){S.online=DS.load();const st=DS.settings();S.mode=st.mode;S.closed=st.closed;render(!!S.cam)}});

/* odkaz z webu: admin/#scan=KÓD otevře skener, admin/#online objednávky */
function route(){
  const h=decodeURIComponent(location.hash||'');
  const m=h.match(/scan=([A-Z0-9-]+)/i);
  if(m){S.role='simon';$('#role').value='simon';S.view='vstup';check(m[1]);return true}
  if(h==='#online'){S.view='rezervace';S.rtab='online';render();return true}
  return false;
}
window.addEventListener('hashchange',route);
if(I18N)I18N.start();
if(!route())render();
</script>
